<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Locked</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232c;--line:#2a323d;
 --txt:#e6edf3;--dim:#8b98a5;--accent:#2f81f7;--bad:#ff7b8a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);
 display:grid;place-items:center;padding:24px;
 font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
.box{width:100%;max-width:380px;border:1px solid var(--line);border-radius:14px;
 padding:26px 24px;background:linear-gradient(135deg,#161b22,#1c232c 60%,#17222f)}
h1{margin:0 0 4px;font-size:19px;letter-spacing:-.2px}
p.sub{margin:0 0 20px;color:var(--dim);font-size:13px}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
input[type=password]{width:100%;padding:11px 12px;border-radius:9px;
 border:1px solid var(--line);background:#0d1117;color:var(--txt);font-size:16px}
input[type=password]:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:14px;padding:11px 12px;border:0;border-radius:9px;
 background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.remember{display:flex;gap:8px;align-items:center;margin-top:14px;
 font-size:12.5px;color:var(--dim)}
.remember input{accent-color:var(--accent);width:15px;height:15px}
.msg{min-height:18px;margin-top:12px;font-size:12.5px;color:var(--bad)}
.msg.work{color:var(--dim)}
.note{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);
 color:var(--dim);font-size:11.5px;line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <h1>Locked</h1>
  <p class="sub">This page is encrypted. Enter the passphrase to read it.</p>
  <form id="f" autocomplete="on">
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" name="password" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="remember"><input id="rm" type="checkbox" checked>
      Stay unlocked on this device</label>
    <button id="go" type="submit">Unlock</button>
  </form>
  <div class="msg" id="msg"></div>
  <p class="note">Nothing readable is sent to your browser until the passphrase is
  correct — the page arrives as ciphertext and is decrypted here on your device.</p>
</div>

/* Sits on the same origin as the other published pages, so the key is namespaced. */
const KEY='fantasy.k';
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const msg = document.getElementById('msg');

async function decrypt(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(CT));
  return new TextDecoder().decode(plain);
}

function reveal(html){
  document.open(); document.write(html); document.close();
}

async function attempt(pw, remember){
  const go = document.getElementById('go');
  go.disabled = true;
  msg.className = 'msg work';
  msg.textContent = 'Decrypting…';
  try{
    const html = await decrypt(pw);
    if(remember) try{ localStorage.setItem(KEY, pw); }catch(e){}
    reveal(html);
    return true;
  }catch(e){
    try{ localStorage.removeItem(KEY); }catch(e2){}
    msg.className = 'msg';
    msg.textContent = "That's not it. Try again.";
    go.disabled = false;
    return false;
  }
}

document.getElementById('f').addEventListener('submit', e=>{
  e.preventDefault();
  attempt(document.getElementById('pw').value, document.getElementById('rm').checked);
});

/* A stored passphrase unlocks straight away; a stale one falls back to the form. */
(async ()=>{
  let saved = null;
  try{ saved = localStorage.getItem(KEY); }catch(e){}
  if(saved){
    msg.className = 'msg work';
    msg.textContent = 'Unlocking…';
    if(await attempt(saved, true)) return;
    msg.textContent = 'Saved passphrase no longer works.';
  }
  document.getElementById('pw').focus();
})();
</script>
